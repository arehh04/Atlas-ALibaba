name: SynapseAir CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Test Suite (Pytest & Self-Bootstrapped QA)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r travel-recovery-os/backend/requirements.txt
          pip install pytest pytest-asyncio pytest-mock httpx

      - name: Run Backend Pytest Suite
        working-directory: travel-recovery-os
        env:
          ENVIRONMENT: test
          PYTHONPATH: .
          SYNAPSE_API_SECRET: test-secret-for-ci
        run: |
          python -m pytest backend/tests/test_qa_suite.py backend/test_swarm.py -v

  frontend-build:
    name: Frontend Build & Typecheck (Vue 3 + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: travel-recovery-os/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: travel-recovery-os/frontend
        run: npm ci

      - name: Build frontend for production
        working-directory: travel-recovery-os/frontend
        run: npm run build
